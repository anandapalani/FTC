databaseChangeLog:

  - changeSet:
      id: 001-create-products-table
      author: bells-team
      comment: "Initial schema — creates the products table"
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: price
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-add-unique-constraint-product-name
      author: bells-team
      comment: "Enforce unique product names"
      changes:
        - addUniqueConstraint:
            tableName: products
            columnNames: name
            constraintName: uq_products_name

  - changeSet:
      id: 003-seed-sample-products
      author: bells-team
      comment: "Insert three seed rows for local dev"
      changes:
        - insert:
            tableName: products
            columns:
              - column:
                  name: name
                  value: "Widget Pro"
              - column:
                  name: description
                  value: "A premium-grade widget"
              - column:
                  name: price
                  valueNumeric: 29.99
        - insert:
            tableName: products
            columns:
              - column:
                  name: name
                  value: "Gadget Lite"
              - column:
                  name: description
                  value: "Entry-level gadget for everyday use"
              - column:
                  name: price
                  valueNumeric: 9.99
        - insert:
            tableName: products
            columns:
              - column:
                  name: name
                  value: "Doohickey Max"
              - column:
                  name: description
                  value: "Industrial-strength doohickey"
              - column:
                  name: price
                  valueNumeric: 149.00
